<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participants - JobReadyDash</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>JobReadyDash</h3>
            </div>
            <ul class="list-unstyled components">
                <li>
                    <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
                </li>
                <li class="active">
                    <a href="participants.html"><i class="bi bi-people"></i> Participants</a>
                </li>
                <li>
                    <a href="analytics.html"><i class="bi bi-bar-chart-line"></i> Analytics</a>
                </li>
                <li style="margin-top: 50px;">
                    <a href="#" class="logout-btn text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <!-- Top Navbar -->
            <nav class="top-navbar">
                <div class="d-flex align-items-center">
                    <button type="button" id="sidebarCollapse" class="btn btn-primary d-none me-3">
                        <i class="bi bi-list"></i>
                    </button>
                    <h4 class="navbar-brand">Participant Management</h4>
                </div>
                <div class="user-profile">
                    <i class="bi bi-bell fs-5 text-muted"></i>
                    <div class="ms-3 d-flex align-items-center">
                        <span class="user-name-display me-2 fw-semibold"></span>
                        <span class="user-role-badge"></span>
                        <i class="bi bi-person-circle fs-4 text-primary ms-2"></i>
                    </div>
                </div>
            </nav>

            <!-- Main Container -->
            <div class="container-fluid px-4">
                
                <div class="card">
                    <div class="card-body">
                        <!-- Toolbar -->
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                            <div class="d-flex gap-2 align-items-center flex-grow-1" style="max-width: 500px;">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                    <input type="text" class="form-control" id="search-input" placeholder="Search by name, email, or ID...">
                                </div>
                                <select class="form-select" id="status-filter" style="width: auto;">
                                    <option value="">All Statuses</option>
                                    <option value="Employed">Employed</option>
                                    <option value="Self-Employed">Self-Employed</option>
                                    <option value="Unemployed">Unemployed</option>
                                    <option value="Pursuing Further Training">In Training</option>
                                </select>
                            </div>
                            <!-- Add Button restricted to Admin and Data Entry -->
                            <button class="btn btn-primary requires-data-entry" id="btn-add-participant" data-bs-toggle="modal" data-bs-target="#participantModal">
                                <i class="bi bi-plus-lg"></i> Add Participant
                            </button>
                        </div>

                        <!-- Data Table -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th class="cursor-pointer" onclick="sortTable('id')">ID <i class="bi bi-arrow-down-up ms-1"></i></th>
                                        <th class="cursor-pointer" onclick="sortTable('name')">Name <i class="bi bi-arrow-down-up ms-1"></i></th>
                                        <th>Contact</th>
                                        <th>District</th>
                                        <th>Program</th>
                                        <th>Status</th>
                                        <th class="text-end requires-data-entry">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="participants-table-body">
                                    <!-- Populated by JS -->
                                    <tr>
                                        <td colspan="7" class="text-center py-4">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination (Frontend implementation for demo) -->
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="text-muted text-sm" id="pagination-info">Showing 0 of 0 entries</span>
                            <ul class="pagination pagination-sm mb-0" id="pagination-controls">
                                <!-- Populated by JS -->
                            </ul>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Participant Form Modal -->
    <div class="modal fade" id="participantModal" tabindex="-1" aria-labelledby="participantModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="participantModalLabel">Add New Participant</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="participant-form">
                    <div class="modal-body">
                        <input type="hidden" id="form-id">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="form-name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="form-name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="form-email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="form-email" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="form-phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="form-phone" pattern="[0-9]{10}" title="10 digit phone number" required>
                            </div>
                            <div class="col-md-6">
                                <label for="form-district" class="form-label">District <span class="text-danger">*</span></label>
                                <select class="form-select" id="form-district" required>
                                    <option value="" selected disabled>Select District</option>
                                    <option value="District A">District A</option>
                                    <option value="District B">District B</option>
                                    <option value="District C">District C</option>
                                    <option value="District D">District D</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="form-program" class="form-label">Skilling Program <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="form-program" required>
                            </div>
                            <div class="col-md-6">
                                <label for="form-status" class="form-label">Employment Status <span class="text-danger">*</span></label>
                                <select class="form-select" id="form-status" required>
                                    <option value="" selected disabled>Select Status</option>
                                    <option value="Employed">Employed</option>
                                    <option value="Self-Employed">Self-Employed</option>
                                    <option value="Unemployed">Unemployed</option>
                                    <option value="Pursuing Further Training">Pursuing Further Training</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="btn-save">Save Participant</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirm Deletion</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete participant <strong id="delete-participant-name"></strong>? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="btn-confirm-delete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/participants.js"></script>
</body>
</html>
