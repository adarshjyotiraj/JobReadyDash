<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - JobReadyDash</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>JobReadyDash</h3>
            </div>
            <ul class="list-unstyled components">
                <li class="active">
                    <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
                </li>
                <li>
                    <a href="participants.html"><i class="bi bi-people"></i> Participants</a>
                </li>
                <li>
                    <a href="analytics.html"><i class="bi bi-bar-chart-line"></i> Analytics</a>
                </li>
                <li style="margin-top: 50px;">
                    <a href="#" class="logout-btn text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <!-- Top Navbar -->
            <nav class="top-navbar">
                <div class="d-flex align-items-center">
                    <button type="button" id="sidebarCollapse" class="btn btn-primary d-none me-3">
                        <i class="bi bi-list"></i>
                    </button>
                    <h4 class="navbar-brand">Overview</h4>
                </div>
                <div class="user-profile">
                    <i class="bi bi-bell fs-5 text-muted"></i>
                    <div class="ms-3 d-flex align-items-center">
                        <span class="user-name-display me-2 fw-semibold"></span>
                        <span class="user-role-badge"></span>
                        <i class="bi bi-person-circle fs-4 text-primary ms-2"></i>
                    </div>
                </div>
            </nav>

            <!-- Main Container -->
            <div class="container-fluid px-4">
                
                <!-- KPI Cards Row -->
                <div class="row mb-4">
                    <div class="col-xl-3 col-md-6">
                        <div class="card kpi-card">
                            <div class="kpi-info">
                                <h5>Total Participants</h5>
                                <h2 id="kpi-total">--</h2>
                            </div>
                            <div class="kpi-icon icon-blue">
                                <i class="bi bi-people-fill"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card kpi-card">
                            <div class="kpi-info">
                                <h5>Placement Rate</h5>
                                <h2 id="kpi-rate">--%</h2>
                            </div>
                            <div class="kpi-icon icon-green">
                                <i class="bi bi-graph-up-arrow"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card kpi-card">
                            <div class="kpi-info">
                                <h5>Employed</h5>
                                <h2 id="kpi-employed">--</h2>
                            </div>
                            <div class="kpi-icon icon-orange">
                                <i class="bi bi-briefcase-fill"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card kpi-card">
                            <div class="kpi-info">
                                <h5>Unemployed</h5>
                                <h2 id="kpi-unemployed">--</h2>
                            </div>
                            <div class="kpi-icon icon-red">
                                <i class="bi bi-exclamation-circle-fill"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="row">
                    <!-- Placement Overview Chart -->
                    <div class="col-lg-7 mb-4">
                        <div class="card h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span>Placement Overview</span>
                                <i class="bi bi-pie-chart text-muted"></i>
                            </div>
                            <div class="card-body">
                                <div class="chart-container">
                                    <canvas id="placementChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Skill Gap Chart -->
                    <div class="col-lg-5 mb-4">
                        <div class="card h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span>Top 5 Skill Gaps</span>
                                <i class="bi bi-bar-chart-steps text-muted"></i>
                            </div>
                            <div class="card-body">
                                <div class="chart-container">
                                    <canvas id="skillGapChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
